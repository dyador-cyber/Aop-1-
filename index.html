<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self' https://webservicesp.anaf.ro https://vpic.nhtsa.dot.gov; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; manifest-src 'self'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fiscan</title>
  <meta name="description" content="Fiscan: fotografiază bonurile, urmărește costurile casei și ale mașinii, kilometrii, expirările RCA/ITP și listele de cumpărături.">
  <meta name="theme-color" content="#1b5e20">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top"><h1>🧾 Fiscan <small>· bonuri, scule, mașini</small></h1></header>
  <main id="view"><p class="center muted">Se încarcă…</p></main>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <div id="more-sheet" class="sheet" aria-hidden="true" role="dialog" aria-label="Mai mult">
    <div class="sheet-handle" aria-hidden="true"></div>
    <div class="sheet-grid">
      <button data-go="lists"><span>📝</span>Liste</button>
      <button data-go="products"><span>📊</span>Produse</button>
      <button data-go="new-project"><span>📁</span>Proiect nou</button>
      <button data-go="ask"><span>💬</span>Întreabă</button>
      <button data-go="check"><span>⚠️</span>De verificat</button>
      <button data-go="settings"><span>⚙️</span>Setări</button>
      <button data-go="export"><span>⬇️</span>Export &amp; backup</button>
      <button data-go="categories"><span>🗂️</span>Categorii</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <div class="nav-grip" aria-hidden="true"></div>
    <button data-view="home"><span>🏠</span>Acasă</button>
    <button data-view="receipts"><span>🧾</span>Bonuri</button>
    <button data-view="inventory"><span>🧰</span>Inventar</button>
    <button data-view="car"><span>🚗</span>Mașină</button>
    <button data-more><span>☰</span>Mai mult</button>
  </nav>

  <dialog id="modal">
    <div class="modal-head"><h2 id="modal-title"></h2><button id="modal-close" aria-label="Închide">✕</button></div>
    <div id="modal-body"></div>
  </dialog>
  <div id="toast" role="status"></div>

  <script src="js/reminder-core.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
